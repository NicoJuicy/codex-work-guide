interface:
  display_name: "Block Diagram Drawer"
  short_description: "Paper-style block diagrams at print size as SVG"
  default_prompt: "Use $block-diagram-drawer to turn this description, sketch or screenshot into a block diagram that reads like an ICRA/IROS/RSS/CoRL paper figure. Keep the content inventory exact, use print-size labels that name things instead of explaining them, move explanations into a caption draft, use real renders and vendored open-source SVG icons, and pass the headless-Chrome QA gate before handing over the SVG, PNG and caption."
